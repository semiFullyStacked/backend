services:
  backend:
    container_name: backend
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - default
      - app-net
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
  db:
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: kinodb_mysql
    image: mysql:8.0

    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kinodb
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql

networks:
  app-net:
    external: true
volumes:
  db_data:
    name: kinodb_volume
