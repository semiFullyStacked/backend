name: Run tests
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  #v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 #v4 
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build and Test with Maven
        run: mvn test -Dspring.profiles.active=default
